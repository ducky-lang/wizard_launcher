<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Wizard Launcher</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="/media/logo.png" alt="">
      <div class="brand-text"><b>Wizard</b><span>Launcher</span></div>
    </div>
    <nav class="nav" id="nav"><span class="nav-indicator" id="navIndicator"></span></nav>
    <div class="sidebar-foot">
      <button class="account-chip" id="accountChip" type="button"></button>
    </div>
  </aside>
  <main class="main">
    <div class="scenery" id="scenery" aria-hidden="true"><svg class="scene-paint" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="skyGlow" cx="68%" cy="30%" r="70%"><stop offset="0" stop-color="#2b2550"/><stop offset=".55" stop-color="#14132a"/><stop offset="1" stop-color="#0c0c10"/></radialGradient><radialGradient id="moonGlow"><stop offset="0" stop-color="#f4e6bd" stop-opacity=".55"/><stop offset="1" stop-color="#f4e6bd" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="900" fill="url(#skyGlow)"/><circle cx="1170" cy="220" r="170" fill="url(#moonGlow)"/><circle cx="1170" cy="220" r="54" fill="#efe2bb"/><g class="stars" fill="#fff"><circle cx="820" cy="120" r="1.6"/><circle cx="940" cy="80" r="1.2"/><circle cx="1010" cy="170" r="1.4"/><circle cx="1320" cy="110" r="1.8"/><circle cx="1420" cy="260" r="1.2"/><circle cx="1500" cy="140" r="1.5"/><circle cx="880" cy="260" r="1.1"/><circle cx="1250" cy="330" r="1.3"/><circle cx="760" cy="200" r="1.2"/><circle cx="1540" cy="60" r="1.4"/></g><path fill="#191733" d="M560 900V640l120-40 90 30 110-70 140 50 150-60 130 40 150-50 150 60v340z"/><path fill="#0f0e1d" d="M700 900V560h30v-60l25-60 25 60v60h30v-90h26v-70l30-80 30 80v70h26v130h40v-50h22v-50l20-50 20 50v50h22v50h40V480h28v-80l34-90 34 90v80h28v120h44v-40h24v-40l18-44 18 44v40h24v40h40v340z"/><g fill="#e8c46a" class="windows"><rect x="726" y="580" width="8" height="14" rx="4"/><rect x="846" y="470" width="10" height="18" rx="5"/><rect x="846" y="530" width="10" height="18" rx="5"/><rect x="1081" y="420" width="10" height="18" rx="5"/><rect x="1081" y="520" width="10" height="18" rx="5"/><rect x="1216" y="560" width="8" height="14" rx="4"/><rect x="976" y="600" width="8" height="14" rx="4"/></g><path fill="#0c0c10" d="M0 900V760c200-40 420-60 640-30s500 40 960-20v190z"/></svg><img id="sceneArt" src="/media/hero.jpg" alt=""></div>
    <header class="topbar">
      <div class="title-wrap"><h1 id="pageTitle"></h1><p id="pageSubtitle"></p></div>
      <div class="chips" id="chips"></div>
    </header>
    <div class="pages" id="pages"></div>
  </main>
</div>
<div class="modal-root" id="modalRoot"></div>
<div class="popover-root" id="popoverRoot"></div>
<div class="toasts" id="toasts"></div>
<div class="boot" id="boot">
  <div class="boot-stage">
    <svg class="boot-sigil" viewBox="0 0 200 200" aria-hidden="true">
      <circle class="sg-outer" cx="100" cy="100" r="92"/>
      <circle class="sg-inner" cx="100" cy="100" r="78"/>
      <path class="sg-star" d="M100 22 168 139H32z M100 178 32 61h136z"/>
    </svg>
    <span class="boot-glow"></span>
    <img class="boot-logo" src="/media/logo.png" alt="">
    <i class="mote m1"></i><i class="mote m2"></i><i class="mote m3"></i><i class="mote m4"></i><i class="mote m5"></i><i class="mote m6"></i><i class="mote m7"></i><i class="mote m8"></i>
  </div>
  <div class="boot-title"><b>Wizard</b><span>Launcher</span></div>
  <div class="boot-line"><i></i></div>
</div>
<script src="i18n.js"></script>
<script src="icons.js"></script>
<script src="bridge.js"></script>
<script src="effects.js"></script>
<script src="app.js"></script>
</body>
</html>
