<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Wizard Launcher</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="/media/logo.png" alt="">
      <div class="brand-text"><b>Wizard</b><span>Launcher</span></div>
    </div>
    <nav class="nav" id="nav"><span class="nav-indicator" id="navIndicator"></span></nav>
    <div class="sidebar-foot">
      <button class="account-chip" id="accountChip" type="button"></button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="title-wrap"><h1 id="pageTitle"></h1><p id="pageSubtitle"></p></div>
      <div class="chips" id="chips"></div>
    </header>
    <div class="pages" id="pages"></div>
  </main>
</div>
<div class="modal-root" id="modalRoot"></div>
<div class="popover-root" id="popoverRoot"></div>
<div class="toasts" id="toasts"></div>
<div class="boot" id="boot"><div class="boot-mark"><img src="/media/logo.png" alt=""><div class="boot-ring"></div></div></div>
<script src="i18n.js"></script>
<script src="icons.js"></script>
<script src="bridge.js"></script>
<script src="effects.js"></script>
<script src="app.js"></script>
</body>
</html>
