name: Probe
on: { push: { branches: ["claude/pack-probe"] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -o rp.zip "https://huggingface.co/datasets/Foxybeo/wz_launcher/resolve/main/Resource%20Pack.zip?download=true"
          curl -sSL -o fo.mrpack "https://cdn.modrinth.com/data/1KVo5zza/versions/2ZbcYfCj/Fabulously.Optimized-5.4.1.mrpack"
          pip install pillow >/dev/null
          python3 - <<'PY'
          import zipfile, json, io, re
          from PIL import Image
          z = zipfile.ZipFile("rp.zip")
          names = z.namelist()
          print("ENTRIES", len(names))
          root = min((n.split("assets/")[0] for n in names if "/assets/" in "/" + n), key=len)
          print("ROOT", repr(root))
          for n in names:
              if n.endswith("pack.mcmeta") and n.count("/") <= 1: print("MCMETA", n, z.read(n)[:300])
          def show(n):
              d = z.read(n)
              if n.endswith(".png"):
                  im = Image.open(io.BytesIO(d)).convert("RGBA"); a = [p[3] for p in im.getdata()]
                  print("PNG", n, im.size, "alpha0", sum(1 for x in a if x == 0), "partial", sum(1 for x in a if 0 < x < 255), "opaque", sum(1 for x in a if x == 255))
              else:
                  print("FILE", n); print(d.decode("utf-8", "replace")[:4000])
          ms = [n for n in names if "models/block/locked_door" in n]
          print("LOCKED", ms)
          seen = set()
          def model(ref):
              ref = ref.replace("minecraft:", "")
              n = "assets/minecraft/models/" + ref + ".json"
              if n in seen or n not in names: 
                  if n not in names: print("NOTINPACK", n)
                  return
              seen.add(n); show(n)
              j = json.loads(z.read(n).decode("utf-8","replace"))
              for t in (j.get("textures") or {}).values():
                  if not t.startswith("#"):
                      tn = "assets/minecraft/textures/" + t.replace("minecraft:","") + ".png"
                      if tn in names: show(tn)
                      else: print("TEXNOTINPACK", tn)
              if "parent" in j: model(j["parent"])
          for n in ms: model(n[len("assets/minecraft/models/"):-5])
          for b in ["oak_door", "birch_door", "iron_door"]:
              n = "assets/minecraft/blockstates/" + b + ".json"
              if n in names: show(n)
          PY
