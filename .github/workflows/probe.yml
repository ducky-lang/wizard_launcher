name: Probe
on:
  push:
    branches: ["claude/cool-knuth-wl1au0"]
    paths: [".github/workflows/probe.yml", ".github/probe/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modrinth fps modpack
        run: python3 .github/probe/modrinth.py
      - name: Resource pack
        run: python3 .github/probe/pack.py
      - name: Map
        run: python3 .github/probe/map.py
