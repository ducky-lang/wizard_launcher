name: Probe
on: { push: { branches: ["claude/cool-knuth-wl1au0"] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, zipfile, io, hashlib
          def get(u, data=None):
              req = urllib.request.Request(u, data=data, headers={"User-Agent": "wizard-launcher-probe"})
              return urllib.request.urlopen(req, timeout=60).read()
          def versions(project, mc):
              q = "https://api.modrinth.com/v2/project/%s/version?game_versions=%%5B%%22%s%%22%%5D&loaders=%%5B%%22fabric%%22%%5D" % (project, mc)
              return json.loads(get(q))
          for project in ["fabulously-optimized", "idMHQ4n2"]:
              vs = versions(project, "1.21.1")
              for v in vs[:3]:
                  f = next(f for f in v["files"] if f["primary"]) if any(f["primary"] for f in v["files"]) else v["files"][0]
                  print("VERSION", project, v["version_number"], v["version_type"], v["date_published"], f["url"], f["hashes"]["sha512"], f["size"])
          fo = versions("fabulously-optimized", "1.21.1")[0]
          f = [f for f in fo["files"] if f["filename"].endswith(".mrpack")][0]
          data = get(f["url"]); print("FO sha512 check", hashlib.sha512(data).hexdigest() == f["hashes"]["sha512"])
          z = zipfile.ZipFile(io.BytesIO(data)); idx = json.loads(z.read("modrinth.index.json"))
          print("FO DEPS", idx["dependencies"], idx["name"], idx["versionId"])
          print("FO MODS", sorted(x["path"] for x in idx["files"]))
          print("FO HOSTS", sorted({x["downloads"][0].split("/")[2] for x in idx["files"]}))
          for n in z.namelist():
              if "moreculling" in n.lower(): print("OVR", n); print(z.read(n).decode()[:800])
          man = json.loads(get("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"))
          e = next(v for v in man["versions"] if v["id"] == "1.21.1")
          vj = json.loads(get(e["url"])); print("JAVA", vj["javaVersion"])
          allj = json.loads(get("https://piston-meta.mojang.com/v1/products/java-runtime/2ec0cc96c44e5a76b9c8b7c39df7210883d12871/all.json"))
          print("RUNTIME KEYS", sorted(allj.keys()))
          for plat in ["windows-x64", "mac-os-arm64", "mac-os", "linux"]:
              print("RUNTIME", plat, json.dumps(allj[plat].get("java-runtime-delta"))[:400])
          rm = json.loads(get(allj["linux"]["java-runtime-delta"][0]["manifest"]["url"]))
          items = list(rm["files"].items())
          print("RUNTIME FILES", len(items)); print(json.dumps(items[:4])[:1200])
          print("LOADER", json.loads(get("https://meta.fabricmc.net/v2/versions/loader/1.21.1"))[0]["loader"]["version"])
          tree = json.loads(get("https://huggingface.co/api/datasets/Foxybeo/wz_launcher/tree/main"))
          print("HF TREE", json.dumps(tree)[:1500])
          PY
