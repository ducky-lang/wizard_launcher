name: Build installers

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon

  windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :launcher-app:jpackage -PjpackageType=app-image --no-daemon
        env: { MC_LAUNCHER_CLIENT_ID: "${{ secrets.MC_LAUNCHER_CLIENT_ID }}" }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path gradle.properties -Pattern '^launcherVersion=(.*)$').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\WizardLauncher.iss
          Get-FileHash build_installer\*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File -Encoding ascii build_installer\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            build_installer/*.exe
            build_installer/SHA256SUMS.txt
          if-no-files-found: error

  macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :launcher-app:jpackage -PjpackageType=dmg --no-daemon
        env: { MC_LAUNCHER_CLIENT_ID: "${{ secrets.MC_LAUNCHER_CLIENT_ID }}" }
      - run: |
          mkdir -p build_installer
          cp launcher-app/build/jpackage/*.dmg build_installer/WizardLauncher-macOS.dmg
          cd build_installer && shasum -a 256 *.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            build_installer/*.dmg
            build_installer/SHA256SUMS.txt
          if-no-files-found: error

  linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :launcher-app:jpackage -PjpackageType=app-image --no-daemon
        env: { MC_LAUNCHER_CLIENT_ID: "${{ secrets.MC_LAUNCHER_CLIENT_ID }}" }
      - name: Build AppImage
        run: |
          sudo apt-get update && sudo apt-get install -y libfuse2
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          mkdir -p AppDir build_installer
          cp -r launcher-app/build/jpackage/WizardLauncher/* AppDir/
          cp installer/linux/wizardlauncher.desktop AppDir/
          cp installer/linux/app.png AppDir/wizardlauncher.png
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/bin/WizardLauncher" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          ARCH=x86_64 ./appimagetool AppDir build_installer/WizardLauncher-Linux-x86_64.AppImage
          cd build_installer && sha256sum *.AppImage > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            build_installer/*.AppImage
            build_installer/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Merge checksums
        run: |
          cat dist/*/SHA256SUMS.txt | sort -k2 > dist/SHA256SUMS.txt
          find dist -mindepth 2 -name SHA256SUMS.txt -delete
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows-installer/*.exe
            dist/macos-installer/*.dmg
            dist/linux-installer/*.AppImage
            dist/SHA256SUMS.txt
          generate_release_notes: true
