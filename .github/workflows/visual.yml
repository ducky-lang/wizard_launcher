name: Visual
on:
  workflow_dispatch: {}
  push:
    branches: ["claude/cool-knuth-wl1au0"]
    paths: [".github/workflows/visual.yml", ".github/probe/visual.py"]
jobs:
  visual:
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.20.1", "1.21.1"]
    runs-on: ubuntu-latest
    env:
      WIZARD_LAUNCHER_DATA: ${{ github.workspace }}/vdata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p legacy-mod build -Pmc=${{ matrix.mc }} --no-daemon -q
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: ./gradlew fetchGameJars :launcher-app:installDist --no-daemon -q
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool imagemagick libgl1-mesa-dri libglx-mesa0 libegl1 > /dev/null
      - if: matrix.mc == '1.21.1'
        run: |
          JAR=$(find ~/.gradle/caches legacy-mod/.gradle -name "minecraft-*merged*1.21.1*.jar" 2>/dev/null | grep -v sources | head -1)
          [ -z "$JAR" ] && JAR=$(find ~/.gradle/caches legacy-mod/.gradle -name "*.jar" 2>/dev/null | grep -i "1.21.1" | grep -iv "sources\|intermediary" | head -1)
          echo "JAR=$JAR"
          for c in net.minecraft.world.effect.MobEffectInstance net.minecraft.network.protocol.game.ClientboundUpdateMobEffectPacket; do
            javap -p -classpath "$JAR" $c | head -60
          done
          javap -c -p -classpath "$JAR" net.minecraft.world.effect.MobEffectInstance | awk '/MobEffectInstance\(net.minecraft.core.Holder<net.minecraft.world.effect.MobEffect>, int, int, boolean, boolean, boolean, net.minecraft.world.effect.MobEffectInstance\);/,/return/'
          javap -c -p -classpath "$JAR" net.minecraft.network.protocol.game.ClientboundUpdateMobEffectPacket | awk '/RegistryFriendlyByteBuf\);/,/return/'
          javap -c -p -classpath "$JAR" net.minecraft.client.multiplayer.ClientPacketListener | awk '/void handleUpdateMobEffect/,/return/'
          javap -c -p -classpath "$JAR" net.minecraft.world.entity.LivingEntity | grep -n "LEVITATION\|getAmplifier\|void travel" | head -20
      - run: |
          unzip -p legacy-mod/build/libs/wizard-legacy-packs-${{ matrix.mc }}.jar wizard_legacy_packs.mixins.json
          unzip -l legacy-mod/build/libs/wizard-legacy-packs-${{ matrix.mc }}.jar | grep -i mixin
      - run: python3 .github/probe/visual.py ${{ matrix.mc }}
        env: { VISUAL_QUICK: "1" }
        timeout-minutes: 30
